name: Build & Release Android APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Rename APK for release
        run: |
          mkdir -p release_assets
          cp app/build/outputs/apk/debug/app-debug.apk release_assets/BlockPuzzle-SnS-v1.1.0.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlockPuzzle-APK
          path: release_assets/BlockPuzzle-SnS-v1.1.0.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/BlockPuzzle-SnS-v1.1.0.apk
          name: "Block Puzzle — S&S Games ${{ github.ref_name }}"
          body: |
            ## BLOCK PUZZLE — S&S GAMES
            **Created by Subhon Qodirov and Sadulloev Sayod**
            *THINK SMART. PLACE BOLD.*

            ### What's New:
            - **Bug Fixes:** Fixed drag-and-drop piece tracking and board snapping coordinates.
            - **Enhanced Ambient Music:** Real-time continuous streaming ambient synthesizer with soothing harmonic chords and delicate bell notes.
            - **Marimba & Crystal SFX:** Rich, organic, zero-latency sound effects.
            - **5 Game Modes:** Classic, Time Attack, Zen, 30 Challenge Levels, and Daily Puzzle.
            - **Multi-language:** English, Russian, and Tajik.
            - **100% Offline & Ad-Free.**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

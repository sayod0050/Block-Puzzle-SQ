name: Build and Release Block Puzzle (S&S Games)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK and Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Restore Keystores
        run: |
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            echo "Restored debug.keystore from base64"
          fi
          if [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          if [ ! -f "my-upload-key.jks" ] && [ -f "debug.keystore" ]; then
            cp debug.keystore my-upload-key.jks
            echo "STORE_PASSWORD=android" >> $GITHUB_ENV
            echo "KEY_PASSWORD=android" >> $GITHUB_ENV
          fi

      - name: Run Automated Tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Build Debug APK (Direct Installable APK)
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Build Release APK
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Build App Bundle (AAB for Google Play)
        run: ./gradlew :app:bundleRelease --no-daemon

      - name: Prepare Direct APK & AAB Files
        run: |
          mkdir -p release-files
          # Direct installable APK (signed and ready for any Android phone)
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp app/build/outputs/apk/debug/app-debug.apk "release-files/BlockPuzzle_S&S.apk"
          fi
          # Release APK
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            cp app/build/outputs/apk/release/app-release.apk "release-files/BlockPuzzle_S&S_Release.apk"
          elif [ -f "app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk "release-files/BlockPuzzle_S&S_Release.apk"
          fi
          # Bundle
          if [ -f "app/build/outputs/bundle/release/app-release.aab" ]; then
            cp app/build/outputs/bundle/release/app-release.aab "release-files/BlockPuzzle_S&S.aab"
          fi
          echo "Release files ready:"
          ls -lh release-files/

      - name: Upload Artifacts (Zip fallback)
        uses: actions/upload-artifact@v4
        with:
          name: BlockPuzzle_S&S_APK
          path: release-files/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish Direct APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0.0' }}
          name: "BLOCK PUZZLE — S&S GAMES ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0.0' }}"
          draft: false
          prerelease: false
          make_latest: true
          files: |
            release-files/BlockPuzzle_S&S.apk
            release-files/BlockPuzzle_S&S_Release.apk
            release-files/BlockPuzzle_S&S.aab
          body: |
            ## 🎮 BLOCK PUZZLE — S&S GAMES
            ### Edition: Premium 2026 | Android | Production Release

            > **"THINK SMART. PLACE BOLD."**  
            > *Created by Sadulloev Sayod and Subhon Qodirov. Made with passion by S&S GAMES.*

            ---

            ### 📱 DIRECT APK DOWNLOAD (No Zip Required!)
            Download directly to your Android device and tap to install:
            - 📥 **[`BlockPuzzle_S&S.apk`](https://github.com/${{ github.repository }}/releases/download/${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0.0' }}/BlockPuzzle_S&S.apk)** — Direct Android APK (Recommended, ready to install immediately)
            - 📥 **[`BlockPuzzle_S&S_Release.apk`](https://github.com/${{ github.repository }}/releases/download/${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0.0' }}/BlockPuzzle_S&S_Release.apk)** — Production Release APK
            - 📦 **[`BlockPuzzle_S&S.aab`](https://github.com/${{ github.repository }}/releases/download/${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0.0' }}/BlockPuzzle_S&S.aab)** — Google Play Store App Bundle

            ---

            ### ✨ Key Game Features
            - **5 Game Modes:** Classic, Time Attack (3-min countdown with time bonuses), Zen (relaxing, unlimited tools), Challenge (30 handcrafted stages with 3 stars), and Daily Puzzle (globally synchronized date seed).
            - **Signature S&S STREAK™ Multiplier:** Consecutive clearing streaks with animated fire meter and score multipliers.
            - **Power-ups:** Undo, Hint, and Shuffle.
            - **3 Visual Themes:** Midnight (Neon Dark), Aurora (Gradient), and Pure (Clean Minimal).
            - **Tri-Lingual Localization:** English, Russian (Русский), and Tajik (Тоҷикӣ).
            - **Sound & Music:** Procedural low-latency PCM waveform synthesizer.
            - **100% Offline & Private:** Zero trackers, zero ads, zero data collection.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

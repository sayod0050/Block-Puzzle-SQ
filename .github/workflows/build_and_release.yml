name: Build and Release Block Puzzle S&S Games

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'
      create_release:
        description: 'Create GitHub Release with APK assets'
        required: true
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test & Build APK/AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Restore Keystores
        run: |
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            echo "Restored debug.keystore from base64"
          fi
          if [ ! -f "my-upload-key.jks" ] && [ -f "debug.keystore" ]; then
            cp debug.keystore my-upload-key.jks
            echo "STORE_PASSWORD=android" >> $GITHUB_ENV
            echo "KEY_PASSWORD=android" >> $GITHUB_ENV
          fi

      - name: Run Unit Tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Build Release APK
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Build Release App Bundle (AAB)
        run: ./gradlew :app:bundleRelease --no-daemon

      - name: Organize Artifacts
        run: |
          mkdir -p artifacts
          # Copy APKs
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            cp app/build/outputs/apk/release/app-release.apk artifacts/BlockPuzzle_SS_Games_v1.0.0_release.apk
          elif [ -f "app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk artifacts/BlockPuzzle_SS_Games_v1.0.0_release.apk
          fi
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp app/build/outputs/apk/debug/app-debug.apk artifacts/BlockPuzzle_SS_Games_v1.0.0_debug.apk
          fi
          # Copy AAB
          if [ -f "app/build/outputs/bundle/release/app-release.aab" ]; then
            cp app/build/outputs/bundle/release/app-release.aab artifacts/BlockPuzzle_SS_Games_v1.0.0_release.aab
          fi
          ls -la artifacts/

      - name: Upload APK & Bundle Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: block-puzzle-ss-binaries
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true')
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Built Artifacts
        uses: actions/download-artifact@v4
        with:
          name: block-puzzle-ss-binaries
          path: artifacts

      - name: Determine Release Tag
        id: tag_info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="${{ github.event.inputs.tag_name }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Release tag: $TAG"

      - name: Create GitHub Release & Attach APK/AAB
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.tag }}
          name: "Block Puzzle — S&S Games ${{ steps.tag_info.outputs.tag }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/*.apk
            artifacts/*.aab
          body: |
            ## 🎮 BLOCK PUZZLE — S&S GAMES
            ### Edition: Premium 2026 | Android | Production Release

            > **"THINK SMART. PLACE BOLD."**  
            > *Created by Sadulloev Sayod and Subhon Qodirov. Made with passion by S&S GAMES.*

            ---

            ### 📦 Download Files
            - **`BlockPuzzle_SS_Games_v1.0.0_release.apk`**: Installable production Android APK.
            - **`BlockPuzzle_SS_Games_v1.0.0_debug.apk`**: Testing & development APK.
            - **`BlockPuzzle_SS_Games_v1.0.0_release.aab`**: Google Play Store App Bundle.

            ---

            ### ✨ Key Features
            - **5 Complete Game Modes:** Classic, Time Attack (3-min countdown), Zen (no pressure, unlimited tools), Challenge (30 solvable levels with 3 stars), and Daily Puzzle (date-seeded globally).
            - **Signature S&S STREAK™ Engine:** Consecutive clearing multiplier with animated flames and bonus points.
            - **Power-ups:** Undo, Hint, and Shuffle.
            - **3 Visual Themes:** Midnight (Neon Dark), Aurora (Vibrant Gradient), and Pure (Clean Minimal).
            - **Tri-Lingual Localization:** English, Russian (Русский), and Tajik (Тоҷикӣ).
            - **Sound & Ambient Music:** Procedural low-latency PCM waveform synthesizer.
            - **100% Offline & Private:** Zero trackers, zero ads, zero data collection.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
